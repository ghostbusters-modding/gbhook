# The ABI self-test. docs/MOD_FORMAT.md is the reference for this file.

[mod]
format      = 1
id          = gb.selftest
version     = 0.1.0
description = Exercises every group of the ABI and logs PASS or FAIL per check
author      = Colin Sullivan

[gbhook]
abi         = 1
plugin      = SelfTest.dll
stage       = boot
priority    = 100

[settings]
greeting           = hello          ; read back by the settings checks
selftest.fault     = 1              ; one frame subscriber faults on purpose, to prove the guard drops only that one
selftest.fail_init = 0              ; return an error from GbhPluginInit, to see the FAIL path in the status table
