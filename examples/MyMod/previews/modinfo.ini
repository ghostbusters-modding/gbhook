version="0.1.0"
compatibility="PC"
description="A small example mod."
link=""

; The keys above are the Mod Manager's. The sections below are gbhook's: docs/MOD_FORMAT.md is the reference.
; A '#' or ';' starts a comment, mid-line too, except inside double quotes. Lists are comma-separated.

[gbhook]
id       = gb.mymod       ; unique; the command, settings and log namespace; matches GBHOOK_PLUGIN in the DLL
abi      = 1              ; GBHOOK_ABI_VERSION from gbhook.h; must match the DLL's manifest
plugin   = MyMod.dll      ; a DLL under gbhook/, or leave the key out
stage    = boot           ; preboot | early | boot | ready
priority = 100            ; within a stage, low runs first
;requires = gb.othermod   ; mod ids that must be present and loaded

[settings]
greeting = hello          ; this mod's default; gbhook.ini overrides it as gb.mymod.greeting
