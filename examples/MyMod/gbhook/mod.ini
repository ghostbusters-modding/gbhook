# mod.ini: what gbhook loads from this folder, and in what order. docs/MOD_FORMAT.md is the reference.
# A '#' or ';' starts a comment, mid-line too. Lists are comma-separated.

[mod]
format      = 1
id          = gb.mymod              ; unique; also the command, settings and log namespace
version     = 0.1.0                 ; stated here because a code-only mod has no previews/modinfo.ini
description = A small example mod
author      = Colin Sullivan

[gbhook]
abi         = 1                     ; GBHOOK_ABI_VERSION from gbhook.h; must match the DLL's manifest
plugin      = MyMod.dll             ; a DLL beside this file, or leave the key out
stage       = boot                  ; preboot | early | boot | ready
priority    = 100                   ; within a stage, low runs first
;requires   = gb.othermod           ; mod ids that must be present and loaded

[settings]
greeting    = hello                 ; this mod's default; gbhook.ini overrides it as gb.mymod.greeting
